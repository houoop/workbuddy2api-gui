# build.yml 多架构打包 GUI 并发布 ghcr.io。
# 本仓库上游（linbeize/workbuddy2api-gui）不带 CI，此文件为本 fork 新增。
name: Build & Publish GUI

on:
  schedule:
    # 每天北京时间 12:37 = UTC 04:37（错开整点，避免 GitHub schedule 排队丢弃）。
    - cron: '37 4 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-qemu 必须在 setup-buildx 之前：buildx 多架构依赖 QEMU 跨平台模拟。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr 镜像名必须全小写：github.repository 可能含大写，需转小写。
      - name: Compute image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 额外导出 amd64 离线 tar.gz：拉不到 ghcr 时用 artifact 部署。
      - name: Export offline tarball (amd64)
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile \
            --tag wbgui:offline --output type=docker,dest=wbgui-amd64.tar .
          gzip -f wbgui-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wbgui-amd64
          path: wbgui-amd64.tar.gz
          if-no-files-found: error
